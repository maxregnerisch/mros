name: Build mros-windows12 ARM64
on:
  push:
    branches: [ main, master, develop ]
    paths:
      - 'mros-**'
      - 'scripts/build-mros.sh'
      - '.github/workflows/build-focal.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'mros-**'
      - 'scripts/build-mros.sh'
      - '.github/workflows/build-focal.yml'
  workflow_dispatch:
    inputs:
      upload_iso:
        description: 'Upload ISO to bashupload.com'
        required: false
        default: 'false'
        type: boolean

env:
  DEBIAN_FRONTEND: noninteractive

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
    
    - name: Free up disk space
      run: |
        # Remove unnecessary packages to free up space
        sudo apt-get remove -y '^dotnet-.*' '^llvm-.*' '^php.*' '^mysql-.*'
        sudo apt-get remove -y azure-cli google-cloud-cli microsoft-edge-stable
        sudo apt-get remove -y google-chrome-stable firefox
        sudo apt-get autoremove -y
        sudo apt-get clean
        
        # Remove large directories
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /usr/local/lib/android
        sudo rm -rf /opt/ghc
        sudo rm -rf /opt/hostedtoolcache/CodeQL
        
        # Show available space
        df -h
    
    - name: Install build dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          debootstrap \
          squashfs-tools \
          xorriso \
          grub-efi-arm64-bin \
          qemu-user-static \
          binfmt-support \
          mtools \
          python3 \
          python3-gi \
          python3-requests \
          python3-pil \
          curl \
          wget \
          zstd
    
    - name: Validate mros configuration
      run: |
        echo "Validating mros-windows12 configuration..."
        
        # Check if configuration file exists
        if [[ ! -f "mros-config/distribution.conf" ]]; then
          echo "Error: Configuration file not found"
          exit 1
        fi
        
        # Check if required directories exist
        required_dirs=(
          "mros-desktop"
          "mros-apps"
          "mros-services"
          "mros-themes"
          "mros-drivers/arm64"
        )
        
        for dir in "${required_dirs[@]}"; do
          if [[ ! -d "$dir" ]]; then
            echo "Error: Required directory not found: $dir"
            exit 1
          fi
        done
        
        echo "Configuration validation passed"
    
    - name: Test mros desktop components
      run: |
        echo "Testing mros desktop components..."
        
        # Test Python syntax
        find mros-desktop mros-apps mros-services -name "*.py" -exec python3 -m py_compile {} \;
        
        # Test import statements (basic validation)
        python3 -c "
        import sys
        sys.path.append('mros-desktop/taskbar')
        sys.path.append('mros-apps/file-manager')
        sys.path.append('mros-services/upload-service')
        
        # Test basic imports (will fail if major syntax errors)
        try:
            import ast
            
            # Parse taskbar.py
            with open('mros-desktop/taskbar/taskbar.py', 'r') as f:
                ast.parse(f.read())
            print('✓ Taskbar syntax OK')
            
            # Parse file-manager.py
            with open('mros-apps/file-manager/file-manager.py', 'r') as f:
                ast.parse(f.read())
            print('✓ File Manager syntax OK')
            
            # Parse upload-service.py
            with open('mros-services/upload-service/upload-service.py', 'r') as f:
                ast.parse(f.read())
            print('✓ Upload Service syntax OK')
            
        except SyntaxError as e:
            print(f'Syntax error: {e}')
            sys.exit(1)
        "
        
        echo "Desktop components test passed"
    
    - name: Create ARM64 build script
      run: |
        echo "Creating ARM64 build script..."
        
        # Create a modified build script for ARM64
        cp scripts/build-mros.sh scripts/build-mros-arm64.sh
        chmod +x scripts/build-mros-arm64.sh
        
        # Modify the script to use ARM64 architecture
        sed -i 's/ARCHITECTURE:-amd64/ARCHITECTURE:-arm64/g' scripts/build-mros-arm64.sh
        sed -i 's/jammy/noble/g' scripts/build-mros-arm64.sh
        sed -i 's/COMPRESSION:-xz/COMPRESSION:-zstd/g' scripts/build-mros-arm64.sh
        
        echo "ARM64 build script created"
    
    - name: Build mros-windows12 ARM64 ISO
      run: |
        echo "Building mros-windows12 ARM64 ISO..."
        
        # Set up build environment
        export WORK_DIR="/tmp/mros-build"
        mkdir -p "$WORK_DIR"
        
        # Run build script with ARM64 configuration
        sudo -E ./scripts/build-mros-arm64.sh
        
        # Check if ISO was created
        iso_file=$(find /tmp/mros-build -name "*.iso" | head -1)
        if [[ -n "$iso_file" && -f "$iso_file" ]]; then
          echo "ISO created successfully: $iso_file"
          echo "ISO_PATH=$iso_file" >> $GITHUB_ENV
          
          # Get ISO info
          iso_size=$(du -h "$iso_file" | cut -f1)
          echo "ISO_SIZE=$iso_size" >> $GITHUB_ENV
          
          # Calculate checksums
          cd "$(dirname "$iso_file")"
          iso_name=$(basename "$iso_file")
          sha256sum "$iso_name" > "${iso_name}.sha256"
          md5sum "$iso_name" > "${iso_name}.md5"
          
          echo "SHA256: $(cat "${iso_name}.sha256")"
          echo "MD5: $(cat "${iso_name}.md5")"
        else
          echo "Error: ISO file not found"
          exit 1
        fi
    
    - name: Upload ISO as GitHub Artifact
      uses: actions/upload-artifact@v4
      with:
        name: mros-windows12-arm64-iso
        path: ${{ env.ISO_PATH }}
        retention-days: 30
        compression-level: 0  # ISO is already compressed
    
    - name: Create release artifacts
      run: |
        echo "Creating release artifacts..."
        
        # Create build info
        cat > build_info.txt << EOF
        Build Date: $(date -u '+%Y-%m-%d %H:%M:%S UTC')
        Git Commit: ${{ github.sha }}
        Git Branch: ${{ github.ref_name }}
        Workflow: ${{ github.workflow }}
        Runner: ${{ runner.os }}
        
        ISO Information:
        - Size: ${ISO_SIZE:-Unknown}
        - Path: ${ISO_PATH:-Unknown}
        EOF
    
    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: mros-windows12-arm64-build-${{ github.run_number }}
        path: |
          build_info.txt
          download_url.txt
        retention-days: 30
    
    - name: Comment on PR with build results
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const buildInfo = `
          ## 🚀 mros-windows12 ARM64 Build Results
          
          **Build Status:** ✅ Success
          **ISO Size:** ${process.env.ISO_SIZE || 'Unknown'}
          **Build Time:** ${new Date().toISOString()}
          
          ${process.env.DOWNLOAD_URL ? `**Download URL:** ${process.env.DOWNLOAD_URL}` : ''}
          
          ### Build Artifacts
          - 📦 ISO file is available as a GitHub Actions artifact
          - 📋 Build information is available in the workflow artifacts
          ${process.env.DOWNLOAD_URL ? '- 🌐 ISO has been uploaded to bashupload.com' : ''}
          
          ### Next Steps
          - Test the ISO on ARM64 devices
          - Verify Windows 12 UI components work correctly
          - Test on various ARM64 platforms (Apple Silicon, Snapdragon, etc.)
          `;
          
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: buildInfo
          });
    
    - name: Summary
      run: |
        echo "## 🎉 mros-windows12 ARM64 Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Status:** ✅ Build completed successfully" >> $GITHUB_STEP_SUMMARY
        echo "**ISO Size:** ${ISO_SIZE:-Unknown}" >> $GITHUB_STEP_SUMMARY
        echo "**Build Date:** $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [[ -n "${DOWNLOAD_URL:-}" ]]; then
          echo "**Download URL:** $DOWNLOAD_URL" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
        fi
        
        echo "### Features Included" >> $GITHUB_STEP_SUMMARY
        echo "- 🖥️ Windows 12-inspired desktop environment" >> $GITHUB_STEP_SUMMARY
        echo "- 💻 Native ARM64 support" >> $GITHUB_STEP_SUMMARY
        echo "- 📱 Optimized for Apple Silicon, Snapdragon, and other ARM64 platforms" >> $GITHUB_STEP_SUMMARY
        echo "- 🎨 Modern Fluent Design with Mica and Acrylic materials" >> $GITHUB_STEP_SUMMARY
        echo "- 🚀 Live CD and installable system" >> $GITHUB_STEP_SUMMARY
