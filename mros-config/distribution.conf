# mros-linux Distribution Configuration
# Windows 12-like Linux Distribution

[DISTRIBUTION]
NAME="mros-windows12"
VERSION="2.0.0"
CODENAME="Nebula"
DESCRIPTION="A modern Windows 12-inspired OS with ARM64 support and enhanced features"
MAINTAINER="mros Team"
WEBSITE="https://github.com/maxregnerisch/mros"

[SYSTEM]
BASE_DISTRO="ubuntu"
BASE_VERSION="24.04"
ARCHITECTURE="arm64"
KERNEL_VERSION="6.8"
INIT_SYSTEM="systemd"

[DESKTOP]
ENVIRONMENT="mros-desktop"
THEME="windows12-theme"
WALLPAPER="/usr/share/mros/wallpapers/default.jpg"
ICON_THEME="mros-icons"
CURSOR_THEME="mros-cursors"

[UI_FEATURES]
ROUNDED_CORNERS=true
TRANSPARENCY_EFFECTS=true
ANIMATIONS=true
BLUR_EFFECTS=true
DARK_MODE_SUPPORT=true
ACCENT_COLOR="#0078d4"
FLUENT_DESIGN=true
MICA_MATERIAL=true
ACRYLIC_MATERIAL=true
ADAPTIVE_THEME=true
DYNAMIC_LIGHTING=true
SNAP_LAYOUTS=true
WIDGETS_SUPPORT=true
VOICE_ASSISTANT=true
TOUCH_OPTIMIZED=true
GESTURE_SUPPORT=true
HAPTIC_FEEDBACK=true

[SERVICES]
UPLOAD_SERVICE=true
NOTIFICATION_SERVICE=true
SEARCH_SERVICE=true
SYSTEM_MONITOR=true
AI_ASSISTANT=true
CLOUD_SYNC=true
WINDOWS_SUBSYSTEM_FOR_LINUX=true
ANDROID_APP_SUPPORT=true
GAMING_MODE=true
COPILOT_INTEGRATION=true
SECURITY_CENTER=true
BIOMETRIC_AUTH=true
DEVICE_ENCRYPTION=true
WINDOWS_UPDATE=true
WINDOWS_DEFENDER=true
WINDOWS_HELLO=true
WINDOWS_STORE=true

[BUILD]
ISO_NAME="mros-windows12-${VERSION}-${ARCHITECTURE}.iso"
LIVE_USER="windows"
LIVE_PASSWORD="live"
AUTO_LOGIN=true
COMPRESSION="zstd"
COMPRESSION_LEVEL="19"
SECURE_BOOT=true
TPM_REQUIRED=true
UEFI_ONLY=true
WINDOWS_BOOT_MANAGER=true
WINDOWS_RECOVERY=true
WINDOWS_PE=true
DRIVER_STORE=true
WINDOWS_INSTALLER=true

[PACKAGES]
MINIMAL_INSTALL=false
INCLUDE_DEVELOPMENT_TOOLS=true
INCLUDE_MULTIMEDIA_CODECS=true
INCLUDE_OFFICE_SUITE=true
INCLUDE_GAMES=false
