# Windows 12 Taskbar Configuration for mros-windows12

[TASKBAR]
# General settings
ENABLED=true
VERSION=1.0.0
POSITION=bottom
ALIGNMENT=center
HEIGHT=48
OPACITY=0.95
BLUR=true
MATERIAL=mica
AUTOHIDE=false
AUTOHIDE_DELAY=500
SHOW_ON_ALL_MONITORS=true

# Appearance
BACKGROUND_LIGHT=#f3f3f3e6
BACKGROUND_DARK=#202020e6
BORDER_RADIUS=8
BORDER_COLOR_LIGHT=#e0e0e0
BORDER_COLOR_DARK=#404040
SHADOW_ENABLED=true
SHADOW_OPACITY=0.2
SHADOW_OFFSET_Y=4
SHADOW_BLUR=10
SHADOW_COLOR=#00000066

# Icons
ICON_SIZE=24
ICON_SPACING=4
ICON_PADDING=8
ICON_ANIMATION=true
ICON_ANIMATION_SPEED=250
ICON_HOVER_EFFECT=scale
ICON_ACTIVE_INDICATOR=line
ICON_ACTIVE_COLOR=#0078d4
ICON_INACTIVE_COLOR_LIGHT=#000000
ICON_INACTIVE_COLOR_DARK=#ffffff
ICON_OPACITY_INACTIVE=0.7
ICON_OPACITY_ACTIVE=1.0

# Start button
START_BUTTON_ENABLED=true
START_BUTTON_POSITION=left
START_BUTTON_ICON=windows12-logo.svg
START_BUTTON_SIZE=24
START_BUTTON_PADDING=12
START_BUTTON_HOVER_EFFECT=glow
START_BUTTON_ACTIVE_EFFECT=zoom
START_BUTTON_COLOR_LIGHT=#000000
START_BUTTON_COLOR_DARK=#ffffff
START_BUTTON_ACTIVE_COLOR=#0078d4

# Search button
SEARCH_BUTTON_ENABLED=true
SEARCH_BUTTON_POSITION=left
SEARCH_BUTTON_ICON=search.svg
SEARCH_BUTTON_SIZE=24
SEARCH_BUTTON_PADDING=12
SEARCH_BUTTON_HOVER_EFFECT=glow
SEARCH_BUTTON_ACTIVE_EFFECT=zoom
SEARCH_BUTTON_COLOR_LIGHT=#000000
SEARCH_BUTTON_COLOR_DARK=#ffffff
SEARCH_BUTTON_ACTIVE_COLOR=#0078d4

# Widgets button
WIDGETS_BUTTON_ENABLED=true
WIDGETS_BUTTON_POSITION=left
WIDGETS_BUTTON_ICON=widgets.svg
WIDGETS_BUTTON_SIZE=24
WIDGETS_BUTTON_PADDING=12
WIDGETS_BUTTON_HOVER_EFFECT=glow
WIDGETS_BUTTON_ACTIVE_EFFECT=zoom
WIDGETS_BUTTON_COLOR_LIGHT=#000000
WIDGETS_BUTTON_COLOR_DARK=#ffffff
WIDGETS_BUTTON_ACTIVE_COLOR=#0078d4

# Task view button
TASK_VIEW_BUTTON_ENABLED=true
TASK_VIEW_BUTTON_POSITION=left
TASK_VIEW_BUTTON_ICON=task-view.svg
TASK_VIEW_BUTTON_SIZE=24
TASK_VIEW_BUTTON_PADDING=12
TASK_VIEW_BUTTON_HOVER_EFFECT=glow
TASK_VIEW_BUTTON_ACTIVE_EFFECT=zoom
TASK_VIEW_BUTTON_COLOR_LIGHT=#000000
TASK_VIEW_BUTTON_COLOR_DARK=#ffffff
TASK_VIEW_BUTTON_ACTIVE_COLOR=#0078d4

# System tray
SYSTEM_TRAY_ENABLED=true
SYSTEM_TRAY_POSITION=right
SYSTEM_TRAY_ICON_SIZE=16
SYSTEM_TRAY_ICON_SPACING=4
SYSTEM_TRAY_PADDING=8
SYSTEM_TRAY_POPUP_ANIMATION=slide-up
SYSTEM_TRAY_POPUP_CORNER_RADIUS=8
SYSTEM_TRAY_POPUP_SHADOW=true
SYSTEM_TRAY_POPUP_BLUR=true
SYSTEM_TRAY_POPUP_MATERIAL=acrylic

# Action center button
ACTION_CENTER_BUTTON_ENABLED=true
ACTION_CENTER_BUTTON_POSITION=right
ACTION_CENTER_BUTTON_ICON=action-center.svg
ACTION_CENTER_BUTTON_SIZE=16
ACTION_CENTER_BUTTON_PADDING=12
ACTION_CENTER_BUTTON_HOVER_EFFECT=glow
ACTION_CENTER_BUTTON_ACTIVE_EFFECT=zoom
ACTION_CENTER_BUTTON_COLOR_LIGHT=#000000
ACTION_CENTER_BUTTON_COLOR_DARK=#ffffff
ACTION_CENTER_BUTTON_ACTIVE_COLOR=#0078d4

# Clock
CLOCK_ENABLED=true
CLOCK_POSITION=right
CLOCK_FORMAT=%H:%M
CLOCK_FONT=Segoe UI
CLOCK_FONT_SIZE=12
CLOCK_FONT_WEIGHT=normal
CLOCK_COLOR_LIGHT=#000000
CLOCK_COLOR_DARK=#ffffff
CLOCK_PADDING=12
CLOCK_HOVER_EFFECT=glow
CLOCK_POPUP_ANIMATION=slide-up
CLOCK_POPUP_CORNER_RADIUS=8
CLOCK_POPUP_SHADOW=true
CLOCK_POPUP_BLUR=true
CLOCK_POPUP_MATERIAL=acrylic

# Taskbar context menu
CONTEXT_MENU_ENABLED=true
CONTEXT_MENU_ANIMATION=fade
CONTEXT_MENU_CORNER_RADIUS=8
CONTEXT_MENU_SHADOW=true
CONTEXT_MENU_BLUR=true
CONTEXT_MENU_MATERIAL=acrylic
CONTEXT_MENU_ITEM_HEIGHT=36
CONTEXT_MENU_ITEM_PADDING=12
CONTEXT_MENU_SEPARATOR_COLOR_LIGHT=#e0e0e0
CONTEXT_MENU_SEPARATOR_COLOR_DARK=#404040

# Taskbar animations
ANIMATION_SHOW=slide-up
ANIMATION_HIDE=slide-down
ANIMATION_DURATION=250
ANIMATION_EASING=ease-in-out

# Taskbar features
SHOW_LABELS=false
COMBINE_BUTTONS=always
SHOW_WINDOW_PREVIEWS=true
WINDOW_PREVIEW_SIZE=200
WINDOW_PREVIEW_CORNER_RADIUS=8
WINDOW_PREVIEW_SHADOW=true
WINDOW_PREVIEW_ANIMATION=fade
WINDOW_PREVIEW_DELAY=500
WINDOW_PREVIEW_CLOSE_BUTTON=true

# Pinned applications
PINNED_APPS=edge.desktop,file-explorer.desktop,settings.desktop,store.desktop,photos.desktop,mail.desktop,terminal.desktop

# Keyboard shortcuts
SHORTCUT_TOGGLE_TASKBAR=Super+T
SHORTCUT_SHOW_DESKTOP=Super+D
SHORTCUT_TASK_VIEW=Super+Tab
SHORTCUT_WIDGETS=Super+W
SHORTCUT_ACTION_CENTER=Super+A
SHORTCUT_START_MENU=Super

# Advanced settings
ENABLE_DRAG_DROP=true
ENABLE_WINDOW_GROUPING=true
ENABLE_JUMP_LISTS=true
ENABLE_LIVE_PREVIEWS=true
ENABLE_PROGRESS_INDICATORS=true
ENABLE_BADGE_NOTIFICATIONS=true
ENABLE_PEEK=true
ENABLE_THUMBNAIL_TOOLBARS=true

