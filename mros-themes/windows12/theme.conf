# Windows 12 Theme Configuration for mros-windows12

[THEME]
NAME=Windows 12
VERSION=1.0.0
AUTHOR=mros Team
DESCRIPTION=Windows 12-inspired theme with Fluent Design, Mica material, and modern UI elements
LICENSE=GPL-3.0

[COLORS]
# Primary colors
PRIMARY=#0078d4
SECONDARY=#005a9e
ACCENT=#0078d4
HIGHLIGHT=#0078d4

# Background colors
BACKGROUND=#f3f3f3
DARK_BACKGROUND=#202020
CARD_BACKGROUND=#ffffff
DARK_CARD_BACKGROUND=#2b2b2b

# Text colors
TEXT=#000000
DARK_TEXT=#ffffff
SECONDARY_TEXT=#505050
DARK_SECONDARY_TEXT=#a0a0a0

# System colors
SUCCESS=#107c10
WARNING=#ffb900
ERROR=#d13438
INFO=#0078d4

# Mica material colors
MICA_LIGHT=#f3f3f3e6
MICA_DARK=#202020e6

# Acrylic material colors
ACRYLIC_LIGHT=#ffffffcc
ACRYLIC_DARK=#202020cc

# Taskbar colors
TASKBAR_LIGHT=#f3f3f3e6
TASKBAR_DARK=#202020e6
TASKBAR_ICON_LIGHT=#000000
TASKBAR_ICON_DARK=#ffffff
TASKBAR_ACCENT=#0078d4

# Start menu colors
START_MENU_LIGHT=#ffffffee
START_MENU_DARK=#2b2b2bee
START_MENU_ACCENT=#0078d4

[FONTS]
SYSTEM_FONT=Segoe UI
MONOSPACE_FONT=Cascadia Code
TITLE_FONT_SIZE=20
SUBTITLE_FONT_SIZE=16
BODY_FONT_SIZE=14
CAPTION_FONT_SIZE=12
SMALL_FONT_SIZE=10

[ICONS]
ICON_THEME=Windows12
ICON_SIZE_SMALL=16
ICON_SIZE_MEDIUM=24
ICON_SIZE_LARGE=32
ICON_SIZE_XLARGE=48
ICON_STYLE=Fluent

[CURSORS]
CURSOR_THEME=Windows12
CURSOR_SIZE=24

[EFFECTS]
# Animations
ENABLE_ANIMATIONS=true
ANIMATION_SPEED=250
TRANSITION_EFFECT=ease-in-out

# Transparency and blur
ENABLE_TRANSPARENCY=true
ENABLE_BLUR=true
BLUR_RADIUS=30
BLUR_SIGMA=15

# Shadows
ENABLE_SHADOWS=true
SHADOW_OPACITY=0.2
SHADOW_OFFSET_X=0
SHADOW_OFFSET_Y=2
SHADOW_BLUR=10
SHADOW_COLOR=#00000066

# Rounded corners
ENABLE_ROUNDED_CORNERS=true
CORNER_RADIUS=8
CORNER_RADIUS_SMALL=4
CORNER_RADIUS_LARGE=12

# Mica material
ENABLE_MICA=true
MICA_OPACITY=0.9

# Acrylic material
ENABLE_ACRYLIC=true
ACRYLIC_OPACITY=0.8

# Dynamic lighting
ENABLE_DYNAMIC_LIGHTING=true
LIGHTING_INTENSITY=0.3

[WINDOWS]
# Window decorations
TITLE_BAR_HEIGHT=32
BORDER_WIDTH=1
BORDER_COLOR=#e0e0e0
DARK_BORDER_COLOR=#404040
ACTIVE_BORDER_COLOR=#0078d4
INACTIVE_BORDER_COLOR=#e0e0e0

# Window controls
WINDOW_CONTROL_SIZE=46
WINDOW_CONTROL_SPACING=0
WINDOW_CONTROL_MARGIN=0

# Window animations
WINDOW_OPEN_ANIMATION=zoom
WINDOW_CLOSE_ANIMATION=zoom
WINDOW_MINIMIZE_ANIMATION=slide-down
WINDOW_MAXIMIZE_ANIMATION=zoom

# Window shadows
WINDOW_SHADOW_OPACITY=0.2
WINDOW_SHADOW_OFFSET_X=0
WINDOW_SHADOW_OFFSET_Y=4
WINDOW_SHADOW_BLUR=20
WINDOW_SHADOW_COLOR=#00000066

# Snap layouts
ENABLE_SNAP_LAYOUTS=true
SNAP_LAYOUT_HOVER_OPACITY=0.9
SNAP_LAYOUT_ANIMATION_SPEED=200

[TASKBAR]
# Taskbar appearance
TASKBAR_HEIGHT=48
TASKBAR_POSITION=bottom
TASKBAR_ALIGNMENT=center
TASKBAR_ICON_SIZE=24
TASKBAR_ICON_SPACING=4
TASKBAR_PADDING=8

# Taskbar features
ENABLE_TASKBAR_GROUPS=true
ENABLE_TASKBAR_LABELS=false
ENABLE_TASKBAR_THUMBNAILS=true
ENABLE_TASKBAR_PEEK=true

# Taskbar animations
TASKBAR_HOVER_ANIMATION=scale
TASKBAR_ACTIVE_ANIMATION=glow
TASKBAR_LAUNCH_ANIMATION=bounce

[START_MENU]
# Start menu appearance
START_MENU_WIDTH=640
START_MENU_HEIGHT=720
START_MENU_PADDING=16
START_MENU_ICON_SIZE=32
START_MENU_ANIMATION=slide-up

# Start menu sections
ENABLE_PINNED_SECTION=true
ENABLE_ALL_APPS_SECTION=true
ENABLE_RECOMMENDED_SECTION=true
ENABLE_POWER_SECTION=true
ENABLE_USER_SECTION=true
ENABLE_SEARCH_BAR=true

[WIDGETS]
# Widgets panel
WIDGETS_PANEL_WIDTH=720
WIDGETS_PANEL_ANIMATION=slide-right
WIDGETS_PANEL_OPACITY=0.95
WIDGETS_PANEL_BLUR=true

# Widget appearance
WIDGET_CORNER_RADIUS=8
WIDGET_SHADOW_OPACITY=0.1
WIDGET_ANIMATION_SPEED=300

[NOTIFICATION_CENTER]
# Notification center appearance
NOTIFICATION_CENTER_WIDTH=360
NOTIFICATION_CENTER_ANIMATION=slide-left
NOTIFICATION_CENTER_OPACITY=0.95
NOTIFICATION_CENTER_BLUR=true

# Notification appearance
NOTIFICATION_WIDTH=360
NOTIFICATION_CORNER_RADIUS=8
NOTIFICATION_SHADOW_OPACITY=0.1
NOTIFICATION_ANIMATION_SPEED=300

[CONTEXT_MENU]
# Context menu appearance
CONTEXT_MENU_CORNER_RADIUS=8
CONTEXT_MENU_SHADOW_OPACITY=0.2
CONTEXT_MENU_ANIMATION=fade
CONTEXT_MENU_OPACITY=0.98
CONTEXT_MENU_BLUR=true

[ASSETS]
# Theme assets
WALLPAPER=windows12-wallpaper.jpg
LOCKSCREEN=windows12-lockscreen.jpg
LOGO=windows12-logo.png
BOOT_ANIMATION=windows12-boot.mp4
SYSTEM_SOUNDS=windows12-sounds

# Icon assets
ICON_FOLDER=icons
CURSOR_FOLDER=cursors
SOUND_FOLDER=sounds

[COMPATIBILITY]
GTK_THEME=Windows12-GTK
QT_THEME=Windows12-QT
XFWM_THEME=Windows12-XFWM
METACITY_THEME=Windows12-Metacity

