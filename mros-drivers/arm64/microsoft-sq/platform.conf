# Microsoft SQ Platform Configuration for mros-windows12

[PLATFORM]
NAME=Microsoft SQ
VENDOR=Microsoft
SUPPORTED_MODELS=SQ1,SQ2,SQ3
ARCHITECTURE=ARM64
ENDIANNESS=little

[BOOT]
BOOTLOADER=UEFI
SECURE_BOOT=true
BOOT_PROTOCOL=UEFI
BOOT_ARGS=earlycon=msm_serial_dm,0x78b0000 console=tty0 console=ttyMSM0,115200n8 root=LABEL=mros-root rw rootwait

[CPU]
CORES_MIN=8
CORES_MAX=10
PERFORMANCE_CORES=true
EFFICIENCY_CORES=true
FREQUENCY_MIN=1800
FREQUENCY_MAX=3400
CACHE_L1=true
CACHE_L2=true
CACHE_L3=true
VIRTUALIZATION=true
CRYPTO_EXTENSIONS=true
VECTOR_EXTENSIONS=true

[GPU]
TYPE=Adreno
CORES_MIN=8
CORES_MAX=12
UNIFIED_MEMORY=true
OPENGL_SUPPORT=true
VULKAN_SUPPORT=true
OPENCL_SUPPORT=true
DIRECTX_SUPPORT=true

[NPU]
TYPE=Microsoft Neural Processing Unit
TERA_OPS=18
AI_MODELS=true
NEURAL_PROCESSING=true
CAMERA_ENHANCEMENT=true
WINDOWS_STUDIO_EFFECTS=true

[MEMORY]
UNIFIED_MEMORY=true
MEMORY_MIN=8
MEMORY_MAX=32
MEMORY_BANDWIDTH=68
MEMORY_CHANNELS=4

[STORAGE]
NVME=true
TRIM_SUPPORT=true
HARDWARE_ENCRYPTION=true
BITLOCKER=true

[DISPLAY]
RESOLUTION_MIN=2880x1920
RESOLUTION_MAX=2880x1920
COLOR_DEPTH=24
HDR_SUPPORT=true
REFRESH_RATE_MIN=60
REFRESH_RATE_MAX=120
VARIABLE_REFRESH=true
TOUCH_SUPPORT=true
PEN_SUPPORT=true

[AUDIO]
CHANNELS=6
SAMPLE_RATE=48000
BIT_DEPTH=24
MICROPHONE=true
SPEAKERS=true
HEADPHONE_JACK=true
DOLBY_ATMOS=true

[NETWORK]
WIFI_STANDARD=WiFi 6E
BLUETOOTH_VERSION=5.3
ETHERNET=false
CELLULAR=true
5G_SUPPORT=true

[CAMERA]
RESOLUTION=1080p
FPS=60
IR_CAMERA=true
FACE_RECOGNITION=true
WINDOWS_HELLO=true
STUDIO_EFFECTS=true

[SECURITY]
SECURE_PROCESSOR=true
FACE_RECOGNITION=true
HARDWARE_ENCRYPTION=true
SECURE_BOOT=true
TPM=true
BITLOCKER=true

[POWER]
BATTERY_SUPPORT=true
POWER_MANAGEMENT=true
SLEEP_STATES=S0,S3
HIBERNATE=true
ESTIMATED_BATTERY_LIFE=16
QUICK_CHARGE=true
SURFACE_CONNECT=true

[SENSORS]
ACCELEROMETER=true
GYROSCOPE=true
AMBIENT_LIGHT=true
MAGNETOMETER=true
HALL_EFFECT=true

[THERMAL]
PASSIVE_COOLING=true
ACTIVE_COOLING=false
THERMAL_ZONES=4

[DRIVERS]
GPU_DRIVER=mros-sq-gpu-driver
NPU_DRIVER=mros-sq-npu-driver
WIFI_DRIVER=mros-sq-wifi-driver
BLUETOOTH_DRIVER=mros-sq-bluetooth-driver
AUDIO_DRIVER=mros-sq-audio-driver
CAMERA_DRIVER=mros-sq-camera-driver
TOUCHSCREEN_DRIVER=mros-sq-touch-driver
PEN_DRIVER=mros-sq-pen-driver
CELLULAR_DRIVER=mros-sq-modem-driver
POWER_DRIVER=mros-sq-power-driver
STORAGE_DRIVER=mros-sq-storage-driver
SURFACE_CONNECT_DRIVER=mros-surface-connect-driver

[FIRMWARE]
BOOT_FIRMWARE=sq-boot-firmware.bin
GPU_FIRMWARE=sq-gpu-firmware.bin
NPU_FIRMWARE=sq-npu-firmware.bin
WIFI_FIRMWARE=sq-wifi-firmware.bin
BLUETOOTH_FIRMWARE=sq-bluetooth-firmware.bin
AUDIO_FIRMWARE=sq-audio-firmware.bin
MODEM_FIRMWARE=sq-modem-firmware.bin
TOUCH_FIRMWARE=sq-touch-firmware.bin
PEN_FIRMWARE=sq-pen-firmware.bin

[COMPATIBILITY]
WINDOWS_APPS=true
X86_EMULATION=true
X64_EMULATION=true
LINUX_APPS=true
ANDROID_APPS=true
SURFACE_ACCESSORIES=true

