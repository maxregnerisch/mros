# Apple Silicon Platform Configuration for mros-windows12

[PLATFORM]
NAME=Apple Silicon
VENDOR=Apple
SUPPORTED_MODELS=M1,M1 Pro,M1 Max,M1 Ultra,M2,M2 Pro,M2 Max,M2 Ultra,M3,M3 Pro,M3 Max,M3 Ultra
ARCHITECTURE=ARM64
ENDIANNESS=little

[BOOT]
BOOTLOADER=UEFI
SECURE_BOOT=true
BOOT_PROTOCOL=Apple Boot Manager
BOOT_ARGS=earlycon=pl011,mmio32,0x09000000 console=tty0 console=ttyAMA0,115200 root=LABEL=mros-root rw rootwait

[CPU]
CORES_MIN=8
CORES_MAX=24
PERFORMANCE_CORES=true
EFFICIENCY_CORES=true
FREQUENCY_MIN=2400
FREQUENCY_MAX=3500
CACHE_L1=true
CACHE_L2=true
CACHE_L3=true
VIRTUALIZATION=true
CRYPTO_EXTENSIONS=true
VECTOR_EXTENSIONS=true

[GPU]
TYPE=Apple GPU
CORES_MIN=7
CORES_MAX=38
UNIFIED_MEMORY=true
METAL_SUPPORT=true
OPENGL_SUPPORT=true
VULKAN_SUPPORT=true
OPENCL_SUPPORT=true

[MEMORY]
UNIFIED_MEMORY=true
MEMORY_MIN=8
MEMORY_MAX=128
MEMORY_BANDWIDTH=200
MEMORY_CHANNELS=8

[STORAGE]
NVME=true
TRIM_SUPPORT=true
HARDWARE_ENCRYPTION=true

[DISPLAY]
RESOLUTION_MIN=2560x1600
RESOLUTION_MAX=6016x3384
COLOR_DEPTH=30
HDR_SUPPORT=true
REFRESH_RATE_MIN=60
REFRESH_RATE_MAX=120
VARIABLE_REFRESH=true

[AUDIO]
CHANNELS=6
SAMPLE_RATE=48000
BIT_DEPTH=24
MICROPHONE=true
SPEAKERS=true
HEADPHONE_JACK=true

[NETWORK]
WIFI_STANDARD=WiFi 6E
BLUETOOTH_VERSION=5.3
ETHERNET=true
THUNDERBOLT=true

[CAMERA]
RESOLUTION=1080p
FPS=60
IR_CAMERA=false
FACE_RECOGNITION=true

[SECURITY]
SECURE_ENCLAVE=true
TOUCH_ID=true
HARDWARE_ENCRYPTION=true
SECURE_BOOT=true

[POWER]
BATTERY_SUPPORT=true
POWER_MANAGEMENT=true
SLEEP_STATES=S0,S3
HIBERNATE=true
ESTIMATED_BATTERY_LIFE=20

[SENSORS]
ACCELEROMETER=true
GYROSCOPE=true
AMBIENT_LIGHT=true
MAGNETOMETER=true
BAROMETER=true

[THERMAL]
PASSIVE_COOLING=true
ACTIVE_COOLING=true
THERMAL_ZONES=5

[DRIVERS]
GPU_DRIVER=mros-apple-gpu-driver
WIFI_DRIVER=mros-apple-wifi-driver
BLUETOOTH_DRIVER=mros-apple-bluetooth-driver
AUDIO_DRIVER=mros-apple-audio-driver
CAMERA_DRIVER=mros-apple-camera-driver
TOUCHPAD_DRIVER=mros-apple-touchpad-driver
KEYBOARD_DRIVER=mros-apple-keyboard-driver
THUNDERBOLT_DRIVER=mros-apple-thunderbolt-driver
POWER_DRIVER=mros-apple-power-driver
NVME_DRIVER=mros-apple-nvme-driver

[FIRMWARE]
BOOT_FIRMWARE=apple-boot-firmware.bin
GPU_FIRMWARE=apple-gpu-firmware.bin
WIFI_FIRMWARE=apple-wifi-firmware.bin
BLUETOOTH_FIRMWARE=apple-bluetooth-firmware.bin
AUDIO_FIRMWARE=apple-audio-firmware.bin

[COMPATIBILITY]
WINDOWS_APPS=true
X86_EMULATION=true
X64_EMULATION=true
LINUX_APPS=true
ANDROID_APPS=true

