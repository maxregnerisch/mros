# Qualcomm Snapdragon Platform Configuration for mros-windows12

[PLATFORM]
NAME=Qualcomm Snapdragon
VENDOR=Qualcomm
SUPPORTED_MODELS=8cx Gen 1,8cx Gen 2,8cx Gen 3,X Elite,X Plus,8c,7c+
ARCHITECTURE=ARM64
ENDIANNESS=little

[BOOT]
BOOTLOADER=UEFI
SECURE_BOOT=true
BOOT_PROTOCOL=UEFI
BOOT_ARGS=earlycon=msm_serial_dm,0x78b0000 console=tty0 console=ttyMSM0,115200n8 root=LABEL=mros-root rw rootwait

[CPU]
CORES_MIN=8
CORES_MAX=12
PERFORMANCE_CORES=true
EFFICIENCY_CORES=true
FREQUENCY_MIN=1800
FREQUENCY_MAX=3400
CACHE_L1=true
CACHE_L2=true
CACHE_L3=true
VIRTUALIZATION=true
CRYPTO_EXTENSIONS=true
VECTOR_EXTENSIONS=true

[GPU]
TYPE=Adreno
CORES_MIN=4
CORES_MAX=12
UNIFIED_MEMORY=true
OPENGL_SUPPORT=true
VULKAN_SUPPORT=true
OPENCL_SUPPORT=true
DIRECTX_SUPPORT=true

[DSP]
TYPE=Hexagon
AI_ACCELERATION=true
AUDIO_PROCESSING=true
IMAGE_PROCESSING=true
SENSOR_FUSION=true

[NPU]
TYPE=Qualcomm AI Engine
TERA_OPS=15
AI_MODELS=true
NEURAL_PROCESSING=true
CAMERA_ENHANCEMENT=true

[MEMORY]
UNIFIED_MEMORY=true
MEMORY_MIN=8
MEMORY_MAX=32
MEMORY_BANDWIDTH=68
MEMORY_CHANNELS=4

[STORAGE]
UFS=true
NVME=true
TRIM_SUPPORT=true
HARDWARE_ENCRYPTION=true

[DISPLAY]
RESOLUTION_MIN=1920x1080
RESOLUTION_MAX=3840x2160
COLOR_DEPTH=24
HDR_SUPPORT=true
REFRESH_RATE_MIN=60
REFRESH_RATE_MAX=120
VARIABLE_REFRESH=true

[AUDIO]
CHANNELS=6
SAMPLE_RATE=48000
BIT_DEPTH=24
MICROPHONE=true
SPEAKERS=true
HEADPHONE_JACK=true

[NETWORK]
WIFI_STANDARD=WiFi 6E
BLUETOOTH_VERSION=5.3
ETHERNET=true
CELLULAR=true
5G_SUPPORT=true

[CAMERA]
RESOLUTION=4K
FPS=60
IR_CAMERA=true
FACE_RECOGNITION=true

[SECURITY]
SECURE_PROCESSOR=true
FINGERPRINT=true
HARDWARE_ENCRYPTION=true
SECURE_BOOT=true

[POWER]
BATTERY_SUPPORT=true
POWER_MANAGEMENT=true
SLEEP_STATES=S0,S3
HIBERNATE=true
ESTIMATED_BATTERY_LIFE=18
QUICK_CHARGE=true

[SENSORS]
ACCELEROMETER=true
GYROSCOPE=true
AMBIENT_LIGHT=true
MAGNETOMETER=true
BAROMETER=true
PROXIMITY=true

[THERMAL]
PASSIVE_COOLING=true
ACTIVE_COOLING=true
THERMAL_ZONES=4

[DRIVERS]
GPU_DRIVER=mros-adreno-gpu-driver
DSP_DRIVER=mros-hexagon-dsp-driver
NPU_DRIVER=mros-qualcomm-ai-driver
WIFI_DRIVER=mros-qcom-wifi-driver
BLUETOOTH_DRIVER=mros-qcom-bluetooth-driver
AUDIO_DRIVER=mros-qcom-audio-driver
CAMERA_DRIVER=mros-qcom-camera-driver
TOUCHSCREEN_DRIVER=mros-qcom-touch-driver
CELLULAR_DRIVER=mros-qcom-modem-driver
POWER_DRIVER=mros-qcom-power-driver
STORAGE_DRIVER=mros-qcom-storage-driver

[FIRMWARE]
BOOT_FIRMWARE=qcom-boot-firmware.bin
GPU_FIRMWARE=adreno-gpu-firmware.bin
DSP_FIRMWARE=hexagon-dsp-firmware.bin
NPU_FIRMWARE=qcom-ai-firmware.bin
WIFI_FIRMWARE=qcom-wifi-firmware.bin
BLUETOOTH_FIRMWARE=qcom-bluetooth-firmware.bin
AUDIO_FIRMWARE=qcom-audio-firmware.bin
MODEM_FIRMWARE=qcom-modem-firmware.bin

[COMPATIBILITY]
WINDOWS_APPS=true
X86_EMULATION=true
X64_EMULATION=true
LINUX_APPS=true
ANDROID_APPS=true

